const BANK=[{"id":"apt-001","bank":"apt","cat":"คณิตศาสตร์","prompt":"เกษตรกรซื้อปุ๋ย 18 กระสอบ ราคาเดิมกระสอบละ 625 บาท ร้านค้าลด 12% จากยอดรวม ต้องจ่ายเงินเท่าไร?","options":["10,000 บาท","9,900 บาท","11,100 บาท","10,125 บาท"],"answer":1,"explanation":"625 × 18 = 11,250 และส่วนลด 12% = 1,350 จึงจ่าย 9,900 บาท","visual":""},{"id":"apt-002","bank":"apt","cat":"คณิตศาสตร์","prompt":"สินเชื่อเงินต้น 240,000 บาท อัตราดอกเบี้ยอย่างง่าย 7.5% ต่อปี หากคิดดอกเบี้ย 8 เดือน (สมมติปีละ 12 เดือน) จะเป็นเงินเท่าใด?","options":["10,500 บาท","12,000 บาท","18,000 บาท","9,000 บาท"],"answer":1,"explanation":"240,000 × 0.075 × 8/12 = 12,000 บาท","visual":""},{"id":"apt-003","bank":"apt","cat":"คณิตศาสตร์","prompt":"รายได้จากการขายข้าวเพิ่มจาก 480,000 เป็น 552,000 บาท คิดเป็นอัตราเพิ่มขึ้นกี่เปอร์เซ็นต์?","options":["20%","15%","12%","18%"],"answer":1,"explanation":"ส่วนเพิ่ม 72,000 ÷ 480,000 = 15%","visual":""},{"id":"apt-004","bank":"apt","cat":"คณิตศาสตร์","prompt":"ต้นทุนเมล็ดพันธุ์ : ปุ๋ย : ค่าแรง = 2 : 3 : 5 ถ้าค่าแรง 37,500 บาท ต้นทุนรวมเท่าใด?","options":["75,000 บาท","67,500 บาท","60,000 บาท","90,000 บาท"],"answer":0,"explanation":"5 ส่วน = 37,500 ดังนั้น 10 ส่วน = 75,000 บาท","visual":""},{"id":"apt-005","bank":"apt","cat":"คณิตศาสตร์","prompt":"กลุ่ม A มีสมาชิก 18 คน คะแนนเฉลี่ย 72 และกลุ่ม B 12 คน คะแนนเฉลี่ย 82 คะแนนเฉลี่ยรวมเท่าใด?","options":["78","77","75","76"],"answer":3,"explanation":"(18×72 + 12×82) ÷ 30 = 76","visual":""},{"id":"apt-006","bank":"apt","cat":"คณิตศาสตร์","prompt":"เครื่องจักร 4 เครื่อง ผลิตได้ 480 หน่วยใน 6 ชั่วโมง หากประสิทธิภาพเท่ากัน เครื่องจักร 5 เครื่องจะผลิตได้กี่หน่วยใน 9 ชั่วโมง?","options":["900","960","800","720"],"answer":0,"explanation":"ผลิตได้ 480/(4×6)=20 หน่วยต่อเครื่องต่อชั่วโมง; 5×9×20=900","visual":""},{"id":"apt-007","bank":"apt","cat":"คณิตศาสตร์","prompt":"ผู้ประกอบการขายผลผลิตหน่วยละ 80 บาท ต้นทุนผันแปรหน่วยละ 50 บาท และมีต้นทุนคงที่ 36,000 บาท ต้องขายอย่างน้อยกี่หน่วยจึงคุ้มทุน?","options":["1,200","1,500","1,000","800"],"answer":0,"explanation":"จุดคุ้มทุน = 36,000 ÷ (80−50) = 1,200 หน่วย","visual":""},{"id":"apt-008","bank":"apt","cat":"คณิตศาสตร์","prompt":"ต้นทุนสินค้า 800 บาท ตั้งราคาขายโดยบวกกำไร 25% ของต้นทุน แล้วลดราคาขาย 10% จากป้าย จะมีกำไรจริงกี่บาท?","options":["80","120","100","200"],"answer":2,"explanation":"ป้ายราคา 1,000 ลด 10% เหลือ 900 เทียบต้นทุน 800 กำไร 100 บาท","visual":""},{"id":"apt-009","bank":"apt","cat":"คณิตศาสตร์","prompt":"ถ้าดอกเบี้ยทบต้นปีละครั้ง เงินต้น 10,000 บาท อัตรา 10% ต่อปี เมื่อครบ 2 ปีมีเงินรวมเท่าใด?","options":["11,000","12,100","12,200","12,000"],"answer":1,"explanation":"10,000 × 1.10² = 12,100 บาท","visual":""},{"id":"apt-010","bank":"apt","cat":"คณิตศาสตร์","prompt":"รถขนส่งวิ่งขาไป 60 กม. ด้วย 40 กม./ชม. และขากลับระยะเท่ากันด้วย 60 กม./ชม. ความเร็วเฉลี่ยตลอดทางเท่าใด?","options":["48 กม./ชม.","52 กม./ชม.","50 กม./ชม.","45 กม./ชม."],"answer":0,"explanation":"ระยะรวม 120 กม. เวลา 1.5+1=2.5 ชม. ความเร็วเฉลี่ย 48 กม./ชม.","visual":""},{"id":"apt-011","bank":"apt","cat":"คณิตศาสตร์","prompt":"ถ้า A ทำงานหนึ่งชิ้นเสร็จใน 6 วัน B ทำเสร็จใน 12 วัน เมื่อทำพร้อมกันจะใช้กี่วัน?","options":["5","3","4","9"],"answer":2,"explanation":"อัตรารวม 1/6+1/12=1/4 งานต่อวัน จึงเสร็จใน 4 วัน","visual":""},{"id":"apt-012","bank":"apt","cat":"คณิตศาสตร์","prompt":"ถุงหนึ่งมีลูกบอลแดง 5 ลูก น้ำเงิน 3 ลูก เขียว 2 ลูก สุ่มหยิบ 1 ลูก ความน่าจะเป็นที่จะไม่ได้น้ำเงินเป็นเท่าใด?","options":["1/2","7/10","3/10","4/5"],"answer":1,"explanation":"มีลูกบอลทั้งหมด 10 ลูก ไม่ใช่น้ำเงิน 7 ลูก จึงเป็น 7/10","visual":""},{"id":"apt-013","bank":"apt","cat":"คณิตศาสตร์","prompt":"ลำดับ 4, 9, 19, 39, 79, … จำนวนถัดไปคือ?","options":["159","149","139","119"],"answer":0,"explanation":"แต่ละพจน์ ×2 + 1 จึงได้ 79×2+1=159","visual":""},{"id":"apt-014","bank":"apt","cat":"คณิตศาสตร์","prompt":"รายได้ 750,000 บาท ต้นทุน 525,000 บาท กำไรคิดเป็นกี่เปอร์เซ็นต์ของรายได้?","options":["42.86%","30%","25%","35%"],"answer":1,"explanation":"กำไร 225,000 ÷ รายได้ 750,000 = 30%","visual":""},{"id":"apt-015","bank":"apt","cat":"คณิตศาสตร์","prompt":"ธนาคารกำหนดให้ภาระผ่อนต่อเดือนไม่เกิน 40% ของรายได้สุทธิ ถ้ารายได้สุทธิ 32,500 บาท และมีหนี้ผ่อนเดิม 5,500 บาท ภาระผ่อนใหม่สูงสุดตามสมมติฐานนี้เท่าใด?","options":["7,500 บาท","13,000 บาท","6,500 บาท","8,000 บาท"],"answer":0,"explanation":"เพดานรวม 32,500×40%=13,000 ลบภาระเดิม 5,500 เหลือ 7,500 บาท (โจทย์สมมติ ไม่ใช่กฎ ธ.ก.ส.)","visual":""},{"id":"apt-016","bank":"apt","cat":"คณิตศาสตร์","prompt":"สาขาหนึ่งมีจำนวนลูกค้าเพิ่ม 20% ปีแรก และลดลง 10% ปีถัดมา เมื่อเทียบกับฐาน 1,000 ราย เหลือลูกค้ากี่ราย?","options":["1,060","1,100","1,080","1,000"],"answer":2,"explanation":"1,000×1.20×0.90 = 1,080 ราย","visual":""},{"id":"apt-017","bank":"apt","cat":"คณิตศาสตร์","prompt":"จากตาราง เดือนใดมีกระแสเงินสุทธิสูงที่สุด?","options":["มีนาคม","เมษายน","มกราคม","กุมภาพันธ์"],"answer":1,"explanation":"สุทธิแต่ละเดือน = 60, 75, 65, 120 พันบาท จึงเป็นเมษายน","visual":"<div class=\"data-table\"><div><b>ตารางรายได้–ค่าใช้จ่าย (พันบาท)<\/b><\/div><table><tr><th>เดือน<\/th><th>รายรับ<\/th><th>ค่าใช้จ่าย<\/th><\/tr><tr><td>มกราคม<\/td><td>240<\/td><td>180<\/td><\/tr><tr><td>กุมภาพันธ์<\/td><td>300<\/td><td>225<\/td><\/tr><tr><td>มีนาคม<\/td><td>260<\/td><td>195<\/td><\/tr><tr><td>เมษายน<\/td><td>400<\/td><td>280<\/td><\/tr><\/table><\/div>"},{"id":"apt-018","bank":"apt","cat":"คณิตศาสตร์","prompt":"จากตาราง เดือนกุมภาพันธ์มีค่าใช้จ่ายคิดเป็นกี่เปอร์เซ็นต์ของรายรับ?","options":["65%","70%","80%","75%"],"answer":3,"explanation":"คำนวณอัตราค่าใช้จ่ายต่อรายรับ = 225/300 = 75%","visual":"<div class=\"data-table\"><div><b>ตารางรายได้–ค่าใช้จ่าย (พันบาท)<\/b><\/div><table><tr><th>เดือน<\/th><th>รายรับ<\/th><th>ค่าใช้จ่าย<\/th><\/tr><tr><td>มกราคม<\/td><td>240<\/td><td>180<\/td><\/tr><tr><td>กุมภาพันธ์<\/td><td>300<\/td><td>225<\/td><\/tr><tr><td>มีนาคม<\/td><td>260<\/td><td>195<\/td><\/tr><tr><td>เมษายน<\/td><td>400<\/td><td>280<\/td><\/tr><\/table><\/div>"},{"id":"apt-019","bank":"apt","cat":"คณิตศาสตร์","prompt":"จากตาราง กระแสเงินสุทธิทั้ง 4 เดือนรวมเท่าใด?","options":["310,000 บาท","330,000 บาท","300,000 บาท","320,000 บาท"],"answer":3,"explanation":"(240−180)+(300−225)+(260−195)+(400−280) = 320 พันบาท","visual":"<div class=\"data-table\"><div><b>ตารางรายได้–ค่าใช้จ่าย (พันบาท)<\/b><\/div><table><tr><th>เดือน<\/th><th>รายรับ<\/th><th>ค่าใช้จ่าย<\/th><\/tr><tr><td>มกราคม<\/td><td>240<\/td><td>180<\/td><\/tr><tr><td>กุมภาพันธ์<\/td><td>300<\/td><td>225<\/td><\/tr><tr><td>มีนาคม<\/td><td>260<\/td><td>195<\/td><\/tr><tr><td>เมษายน<\/td><td>400<\/td><td>280<\/td><\/tr><\/table><\/div>"},{"id":"apt-020","bank":"apt","cat":"คณิตศาสตร์","prompt":"จากตาราง หากเดือนเมษายนมีค่าใช้จ่ายเพิ่มอีก 15% โดยรายรับเท่าเดิม กระแสเงินสุทธิเหลือเท่าใด?","options":["80,000 บาท","86,000 บาท","78,000 บาท","82,000 บาท"],"answer":2,"explanation":"ค่าใช้จ่ายใหม่ 280,000×1.15=322,000 สุทธิ 400,000−322,000=78,000 บาท","visual":"<div class=\"data-table\"><div><b>ตารางรายได้–ค่าใช้จ่าย (พันบาท)<\/b><\/div><table><tr><th>เดือน<\/th><th>รายรับ<\/th><th>ค่าใช้จ่าย<\/th><\/tr><tr><td>มกราคม<\/td><td>240<\/td><td>180<\/td><\/tr><tr><td>กุมภาพันธ์<\/td><td>300<\/td><td>225<\/td><\/tr><tr><td>มีนาคม<\/td><td>260<\/td><td>195<\/td><\/tr><tr><td>เมษายน<\/td><td>400<\/td><td>280<\/td><\/tr><\/table><\/div>"},{"id":"apt-021","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"ทุกโครงการที่ผ่านการอนุมัติได้รับการประเมินความเสี่ยง และมีโครงการที่ประเมินความเสี่ยงแล้วบางส่วนไม่ได้รับอนุมัติ ข้อใดสรุปได้แน่นอน?","options":["โครงการที่ไม่ได้ประเมินความเสี่ยงไม่อาจเป็นโครงการที่ผ่านอนุมัติ","ทุกโครงการที่ประเมินความเสี่ยงได้รับอนุมัติ","มีโครงการที่ได้รับอนุมัติโดยไม่ประเมินความเสี่ยง","โครงการที่ไม่ผ่านอนุมัติทุกโครงการได้รับการประเมินความเสี่ยง"],"answer":0,"explanation":"ถ้าอนุมัติแล้วต้องประเมิน จึงสรุปกลับด้านว่าไม่ประเมินย่อมไม่ผ่านอนุมัติ (contrapositive)","visual":""},{"id":"apt-022","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"เงื่อนไข: ผู้สมัครที่ผ่านสัมภาษณ์ต้องผ่านข้อเขียนก่อน นาย ก ผ่านข้อเขียน แต่ไม่ผ่านสัมภาษณ์ ข้อใดถูกต้อง?","options":["เป็นไปได้ตามเงื่อนไข","แสดงว่าเขาไม่ได้สอบข้อเขียน","ขัดกับเงื่อนไข","สรุปได้ว่าเกณฑ์สัมภาษณ์ผิด"],"answer":0,"explanation":"การผ่านข้อเขียนเป็นเงื่อนไขจำเป็น ไม่ได้รับประกันว่าจะผ่านสัมภาษณ์","visual":""},{"id":"apt-023","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"ถ้า “ทุกคนที่มีเอกสารครบได้รับสิทธิ์ตรวจสอบ” และ “บุคคล X ไม่มีสิทธิ์ตรวจสอบ” สรุปอะไรได้แน่นอน?","options":["X ส่งเอกสารล่าช้า","X ไม่สมัครสอบ","X เอกสารไม่ครบ","X ถูกตัดสิทธิ์ถาวร"],"answer":2,"explanation":"จากครบ → ได้สิทธิ์ จึงถ้าไม่ได้สิทธิ์ → ไม่ครบ ตามตรรกะโจทย์","visual":""},{"id":"apt-024","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"A ทำงานก่อน B, D ทำงานหลัง B, C ทำงานก่อน D และ C ทำงานหลัง A ข้อใดเป็นลำดับที่เป็นไปได้?","options":["C–A–B–D","D–B–C–A","B–A–C–D","A–C–B–D"],"answer":3,"explanation":"A ต้องมาก่อน B และ C; B,C ต้องมาก่อน D ส่วน B กับ C สลับกันได้","visual":""},{"id":"apt-025","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"ถ้าคนที่ไม่ทำประกันพืชผลทุกคนต้องมีเงินสำรอง แต่คุณป้องไม่มีเงินสำรอง ข้อใดตามมา?","options":["คุณป้องไม่ทำการเกษตร","คุณป้องได้รับเงินอุดหนุน","คุณป้องมีหนี้สิน","คุณป้องทำประกันพืชผล"],"answer":3,"explanation":"ไม่ทำประกัน → มีเงินสำรอง ดังนั้นไม่มีเงินสำรอง → ทำประกัน (ภายใต้สมมติฐานโจทย์)","visual":""},{"id":"apt-026","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"ลำดับตัวเลข 2, 6, 12, 20, 30, … ค่าถัดไปคือ?","options":["36","44","40","42"],"answer":3,"explanation":"ผลต่าง +4,+6,+8,+10 จึงเพิ่ม 12 ได้ 42","visual":""},{"id":"apt-027","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"ลำดับตัวอักษร A, C, F, J, O, … ตัวถัดไปคือ?","options":["W","T","U","V"],"answer":2,"explanation":"ตำแหน่ง 1,3,6,10,15 เพิ่ม 2,3,4,5 ดังนั้น +6 = 21 คือ U","visual":""},{"id":"apt-028","bank":"apt","cat":"การคิดวิเคราะห์และเหตุผล","prompt":"ถ้าคะแนนของ P มากกว่า Q, คะแนน R น้อยกว่า S แต่สูงกว่า Q และ P น้อยกว่า S ข้อใดแน่นอน?","options":["R สูงกว่า P","Q สูงกว่า S","S สูงกว่า Q","P ต่ำกว่า Q"],"answer":2,"explanation":"ม ,"0.83 เท่า","1.20 เท่า"],"answer":3,"explanation":"DSCR = 540,000/450,000 = 1.20 เท่า","visual":""},{"id":"biz-004","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"โครงการใช้เงินลงทุนเริ่มต้น 400,000 บาท และมีกระแสเงินสดสุทธิปีละ 100,000 บาทเท่ากัน โดยไม่คิดมูลค่าเวลาเงิน คืนทุนแบบง่ายกี่ปี?","options":["5 ปี","4 ปี","6 ปี","3 ปี"],"answer":1,"explanation":"Payback Period แบบง่าย = 400,000/100,000 = 4 ปี","visual":""},{"id":"biz-005","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"การวิเคราะห์ความไว (Sensitivity Analysis) ของสินเชื่อเกษตรควรตรวจข้อใดเป็นอันดับแรก?","options":["สมมติเกษตรกรมีรายได้คงที่ตลอดไป","เพิ่มจำนวนผู้ติดตามเพจโดยไม่เกี่ยวกับยอดขาย","เปลี่ยนสีโลโก้ของกิจการ","สมมติราคาขายลดและต้นทุนเพิ่มแล้วประเมินความสามารถจ่ายหนี้"],"answer":3,"explanation":"สินค้าเกษตรเผชิญความผันผวนของราคา ผลผลิต และต้นทุน การ stress test จึงจำเป็น","visual":""},{"id":"biz-006","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"โครงการ A ให้ NPV = +120,000 บาท ส่วน B ให้ NPV = −20,000 บาท ณ อัตราคิดลดเดียวกัน หากพิจารณา NPV อย่างเดียว ควรเลือกอย่างไร?","options":["เลือก B เพราะลงทุนได้มากกว่า","เลือก A เพราะสร้างมูลค่าปัจจุบันสุทธิบวก","เลือก B เพราะ NPV ติดลบทำให้เสี่ยงต่ำ","ปฏิเสธทั้งสอง"],"answer":1,"explanation":"NPV บวกแปลว่าผลตอบแทนเกินต้นทุนเงินทุนภายใต้สมมติฐาน","visual":""},{"id":"biz-007","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"เกษตรกรมีรายได้หลังฤดูเก็บเกี่ยวเพียงปีละ 2 ครั้ง ตารางชำระหนี้ใดมีเหตุผลที่สุดเมื่อปัจจัยอื่นเท่ากัน?","options":["ให้ผ่อนเท่ากันทุกสัปดาห์โดยไม่ดูรายได้","ออกแบบกำหนดชำระให้สอดคล้องรอบรายรับหลังเก็บเกี่ยว","ให้ชำระตามความสะดวกโดยไม่กำหนดวัน","ให้จ่ายเงินต้นทั้งหมดในเดือนแรก"],"answer":1,"explanation":"การ matching รอบการชำระกับกระแสเงินสดลดโอกาสผิดนัด","visual":""},{"id":"biz-008","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"หลักการแบ่งแยกหน้าที่ (Segregation of Duties) ในกระบวนการสินเชื่อมีเป้าหมายหลักใด?","options":["ตัดขั้นตอนจัดเก็บเอกสาร","ลดการแข่งขันระหว่างสาขา","ลดข้อผิดพลาดและการทุจริตจากการรวมอำนาจ","ให้คนเดียวรับคำขอ ประเมิน และอนุมัติเร็วที่สุด"],"answer":2,"explanation":"การแยกผู้วิเคราะห์ ผู้อนุมัติ และผู้ควบคุมช่วยควบคุมความเสี่ยงและผลประโยชน์ทับซ้อน","visual":""},{"id":"biz-009","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"ก่อนเบิกจ่ายวงเงินสินเชื่อ เจ้าหน้าที่ควรดำเนินการใดตามลำดับที่เหมาะสม?","options":["ยกเว้นการตรวจเพราะเป็นลูกค้าเก่า","ตรวจเงื่อนไขอนุมัติ สัญญา และความสมบูรณ์ของหลักประกันตามเกณฑ์","ปล่อยเงินก่อนแล้วค่อยตรวจเอกสารหลักประกัน","อาศัยเพียงคำรับรองด้วยวาจา"],"answer":1,"explanation":"ก่อน disbursement ควรตรวจเงื่อนไขก่อนเบิกจ่าย (conditions precedent) และเอกสารสิทธิ/สัญญา","visual":""},{"id":"biz-010","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"การติดตามลูกหนี้หลังปล่อยสินเชื่อควรมุ่งเน้นข้อมูลใด?","options":["กระแสเงินสด ผลประกอบการ และสัญญาณเตือนผิดนัด","ความนิยมของชื่อผลิตภัณฑ์","จำนวนสาขาของธนาคารคู่แข่งเท่านั้น","เฉพาะราคาหลักประกัน ณ วันอนุมัติ"],"answer":0,"explanation":"Post-lending monitoring ดูความเสี่ยงจากกิจการและความสามารถชำระหนี้ที่เปลี่ยนแปลง","visual":""},{"id":"biz-011","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"สัญญาณเตือนล่วงหน้า (Early Warning Signal) ของหนี้เกษตรข้อใดชัดเจนที่สุด?","options":["ผู้กู้จ่ายช้าซ้ำและยอดขายลดลงพร้อมกัน","ลูกค้ามีประกันภัยที่เหมาะสม","รายได้เป็นไปตามแผน","ลูกค้าส่งเอกสารครบ"],"answer":0,"explanation":"การชำระล่าช้าต่อเนื่องร่วมกับรายได้ลด เป็นความเสี่ยงที่ต้องติดตาม","visual":""},{"id":"biz-012","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"วัตถุประสงค์ของการจัดชั้นลูกหนี้และประเมินผลขาดทุนด้านเครดิตคืออะไร?","options":["เพื่อยกเว้นการบันทึกดอกเบี้ยทุกชนิด","เพื่อชี้วัดคุณภาพงานประชาสัมพันธ์เท่านั้น","สะท้อนคุณภาพลูกหนี้และความสูญเสียที่คาดว่าจะเกิดขึ้น","เพื่อกำหนดสีบัตรลูกค้า"],"answer":2,"explanation":"การประเมิน Credit Loss ช่วยสะท้อนความเสี่ยงคุณภาพสินเชื่ออย่างมีระบบ","visual":""},{"id":"biz-013","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"ลูกหนี้ประสบภัยแล้งชั่วคราว ย },{"id":"biz-018","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"PD 4%, LGD 40%, EAD 1,000,000 บาท ผลขาดทุนด้านเครดิตคาดหวังแบบอย่างง่ายเท่าใด?","options":["4,000 บาท","160,000 บาท","40,000 บาท","16,000 บาท"],"answer":3,"explanation":"0.04×0.40×1,000,000 = 16,000 บาท ไม่ใช่การวัด ECL ตามมาตรฐานฉบับเต็ม","visual":""},{"id":"biz-019","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"ผู้ปลูกทุเรียนมีรายได้ผูกกับตลาดส่งออกเพียงประเทศเดียว แนวทางลดความเสี่ยงเชิงธุรกิจและสินเชื่อเหมาะสมที่สุดคือ?","options":["ใช้ราคาขายสูงสุดย้อนหลังเป็นฐานคงที่","สำรวจช่องทางตลาดใหม่พร้อมทบทวนกระแสเงินสดและแผนฉุกเฉิน","ยกเลิกการประเมินยอดขาย","เพิ่มหนี้เพื่อขยายไปตลาดเดิมอย่างเดียว"],"answer":1,"explanation":"การกระจายตลาดลด concentration risk และการใช้ stress scenario ช่วยประเมินหนี้","visual":""},{"id":"biz-020","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"สัญญาค้ำประกันตามหลักกฎหมายแพ่งโดยทั่วไปมีลักษณะใด?","options":["บุคคลที่สามรับผิดต่อเจ้าหนี้หากลูกหนี้ไม่ชำระตามเงื่อนไขกฎหมายและสัญญา","การฝากเงินไว้บัญชีกระแสรายวัน","การประกันราคาสินค้าเกษตร","การโอนกรรมสิทธิ์ที่ดินให้เจ้าหนี้ทันที"],"answer":0,"explanation":"ค้ำประกันเป็นสัญญาที่บุคคลภายนอกผูกพันต่อเจ้าหนี้ในหนี้ของลูกหนี้ตามกฎหมาย","visual":""},{"id":"biz-021","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"การจำนองอสังหาริมทรัพย์โดยทั่วไปเป็นการประกันหนี้ลักษณะใด?","options":["ต้องส่งมอบที่ดินให้ธนาคารใช้ประโยชน์เสมอ","ทำได้ด้วยคำบอกเล่าอย่างเดียว","เจ้าหนี้ต้องรับโอนกรรมสิทธิ์ทุกครั้งตั้งแต่เริ่มกู้","นำอสังหาริมทรัพย์ประกันหนี้โดยไม่ต้องส่งมอบทรัพย์ให้เจ้าหนี้ครอบครอง"],"answer":3,"explanation":"จำนองอสังหาริมทรัพย์เพื่อประกันหนี้โดยไม่ส่งมอบการครอบครอง และมีพิธีการจดทะเบียนตามกฎหมาย","visual":""},{"id":"biz-022","bank":"biz","cat":"1. สินเชื่อและกฎหมายสินเชื่อ","prompt":"ข้อใดอธิบาย “อายุความ” ในทางหนี้ได้เหมาะสมที่สุด?","options":["เวลาที่เงินฝากต้องอยู่ครบจึงได้โบนัส","กำหนดวันครบปีบัญชีธนาคาร","ช่วงเวลาที่มีผลต่อสิทธิเรียกร้องทางกฎหมายตามประเภทหนี้","ระยะเวลาบังคับให้สินท ,000 บาท และ 65%","420,000 บาท และ 35%","420,000 บาท และ 53.85%","480,000 บาท และ 40%"],"answer":1,"explanation":"กำไรขั้นต้น 1,200,000−780,000=420,000; gross margin =420,000/1,200,000=35%","visual":""},{"id":"biz-033","bank":"biz","cat":"2. บัญชีและการเงิน","prompt":"กิจการมีสินทรัพย์หมุนเวียน 900,000 บาท และหนี้สินหมุนเวียน 600,000 บาท Current Ratio เท่าใด?","options":["1.50 เท่า","2.50 เท่า","1.00 เท่า","0.67 เท่า"],"answer":0,"explanation":"Current ratio = 900,000/600,000 = 1.50 เท่า","visual":""},{"id":"biz-034","bank":"biz","cat":"2. บัญชีและการเงิน","prompt":"ลูกหนี้การค้าเพิ่มขึ้นมากโดยยอดขายและต้นทุนแทบไม่เปลี่ยน ผลต่อกระแสเงินสดดำเนินงานโดยทั่วไปเป็นอย่างไร?","options":["ทำให้หนี้สินลดทั้งหมด","กระแสเงินสดเพิ่มเสมอ","กระแสเงินสดอาจลดเพราะเก็บเงินจากการขายช้าลง","ไม่มีผลเพราะลูกหนี้ไม่ใช่สินทรัพย์"],"answer":2,"explanation":"ยอดลูกหนี้เพิ่มหมายถึงรายได้จำนวนหนึ่งยังไม่ได้รับเป็นเงินสด","visual":""},{"id":"biz-035","bank":"biz","cat":"2. บัญชีและการเงิน","prompt":"กิจการมีกำไรสุทธิ 250,000 บาท แต่เงินสดจากกิจกรรมดำเนินงานติดลบ สรุปใดเหมาะสมที่สุด?","options":["ต้องเป็นการทุจริตเสมอ","งบกระแสเงินสดไม่สำคัญ","มีกำไรจึงไม่มีปัญหาสภาพคล่อง","กำไรทางบัญชีอาจไม่เท่ากับเงินสดที่ได้รับจริง"],"answer":3,"explanation":"การรับรู้รายได้และค่าใช้จ่ายตามเกณฑ์คงค้างต่างจาก cash flow","visual":""},{"id":"biz-036","bank":"biz","cat":"2. บัญชีและการเงิน","prompt":"ซื้อเครื่องจักร 500,000 บาท อายุใช้งาน 5 ปี มูลค่าซาก 50,000 บาท ใช้วิธีเส้นตรง ค่าเสื่อมราคาต่อปีเท่าไร?","options":["90,000 บาท","80,000 บาท","50,000 บาท","100,000 บาท"],"answer":0,"explanation":"(500,000−50,000)/5 = 90,000 บาท/ปี","visual":""},{"id":"biz-037","bank":"biz","cat":"2. บัญชีและการเงิน","prompt":"หนี้สินรวม 1.8 ล้านบาท ส่วนของเจ้าของ 1.2 ล้านบาท อัตราส่วนหนี้สินต่อทุน (D/E) เท่าใด?","options":["0.67 เท่า","1.20 เท่า","2.00 เท่า","1.50 เท่า"],"answer":3,"explanation":"หนี้สินหารด้วยทุน = 1.8/1.2 = 1.50 เท่า","visual":""},{"id":"biz-038","bank":"biz","cat":"2. บัญชีและการเงิน","prompt":"ต้นทุนสินค้าคงเห ยเงินเดือน / เครดิต เงินสด","เดบิต เงินสด / เครดิต เงินเดือนค้างจ่าย","เดบิต ค่าใช้จ่ายเงินเดือน / เครดิต เงินเดือนค้างจ่าย"],"answer":3,"explanation":"ตามเกณฑ์คงค้าง ต้องรับรู้ค่าใช้จ่ายและหนี้สินที่เกิดแล้วแต่ยังไม่จ่าย","visual":""},{"id":"fin-007","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ได้รับเงินค่าบริการล่วงหน้า 120,000 บาทสำหรับบริการ 6 เดือน โดยบันทึกเป็นหนี้สินทั้งหมด ผ่านไปแล้ว 2 เดือน ควรรับรู้รายได้เท่าไร?","options":["20,000 บาท","40,000 บาท","60,000 บาท","80,000 บาท"],"answer":1,"explanation":"120,000×2/6 = 40,000 บาท หนี้สินรายได้รับล่วงหน้าลด และรายได้เพิ่ม","visual":""},{"id":"fin-008","bank":"fin","cat":"1. หลักการบัญชี","prompt":"อุปกรณ์ราคา 360,000 บาท อายุใช้งาน 5 ปี มูลค่าคงเหลือ 60,000 บาท คิดค่าเสื่อมเส้นตรงต่อปีเท่าไร?","options":["60,000 บาท","72,000 บาท","75,000 บาท","84,000 บาท"],"answer":0,"explanation":"(360,000 - 60,000) ÷ 5 = 60,000 บาทต่อปี","visual":""},{"id":"fin-009","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ซื้อสินค้า 100 หน่วย หน่วยละ 50 บาท และอีก 80 หน่วย หน่วยละ 60 บาท ขายออก 120 หน่วย หากใช้ FIFO (สมมติระบบต่อเนื่อง) ต้นทุนขายเท่าไร?","options":["6,800 บาท","6,600 บาท","6,200 บาท","7,200 บาท"],"answer":2,"explanation":"ใช้ล็อตแรก 100×50 = 5,000 และล็อตสอง 20×60 = 1,200 รวม 6,200 บาท","visual":""},{"id":"fin-010","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ลูกค้าชำระหนี้การค้า 18,000 บาทที่เคยบันทึกลูกหนี้ไว้แล้ว รายการใดถูกต้อง?","options":["เดบิต เงินสด / เครดิต รายได้","เดบิต ลูกหนี้การค้า / เครดิต เงินสด","เดบิต ค่าใช้จ่าย / เครดิต ลูกหนี้การค้า","เดบิต เงินสด / เครดิต ลูกหนี้การค้า"],"answer":3,"explanation":"เงินสดเพิ่มและลูกหนี้ลด ไม่ใช่รายได้ใหม่","visual":""},{"id":"fin-011","bank":"fin","cat":"1. หลักการบัญชี","prompt":"บันทึกค่าซ่อมเครื่องจักร 8,000 บาทเป็นเดบิตเครื่องจักร ทั้งที่เป็นค่าซ่อมตามปกติ ควรแก้ไขอย่างไร?","options":["เดบิต เครื่องจักร / เครดิต ค่าซ่อม","เดบิต ค่าซ่อม / เครดิต เครื่องจักร","เดบิต เงินสด / เครดิต ค่าซ่อม","เดบิต ค่าเสื่อม / เครดิต เงินสด"],"answer":1,"explanation":"ค่าซ่อมปกติเป็นค่าใช้จ่าย ไม่ใช่รายจ่ายฝ่ายทุน จึงโอนจากบัญชีเครื่องจักรเป็นค่าซ่อม","visual":""},{"id":"fin-012","bank":"fin","cat":"1. หลักการบัญชี","prompt":"เงินกู้ 600,000 บาท ดอกเบี้ย 9% ต่อปี เริ่มกู้ 1 ตุลาคม ยังไม่จ่ายดอกเบี้ย ณ 31 ธันวาคม ต้องตั้งดอกเบี้ยค้างจ่ายเท่าไร (ใช้ 3/12 ปี)?","options":["9,000 บาท","12,000 บาท","13,500 บาท","54,000 บาท"],"answer":2,"explanation":"600,000×9%×3/12 = 13,500 บาท","visual":""},{"id":"fin-013","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ยอดตามใบแจ้งยอดธนาคาร 248,000 บาท มีเงินฝากระหว่างทาง 32,000 บาท เช็คสั่งจ่ายค้างขึ้นเงิน 19,000 บาท ยอดเงินสดตามธนาคารที่ปรับปรุงแล้วเท่าไร?","options":["261,000 บาท","235,000 บาท","299,000 บาท","280,000 บาท"],"answer":0,"explanation":"ยอดปรับปรุง = 248,000 + 32,000 - 19,000 = 261,000 บาท","visual":""},{"id":"fin-014","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ปลายปีมียอดลูกหนี้ 900,000 บาท คาดว่าจะเก็บไม่ได้ 2% และบัญชีค่าเผื่อผลขาดทุนมีเครดิตอยู่แล้ว 5,000 บาท ต้องบันทึกค่าใช้จ่ายเพิ่มเติมเท่าไร (ใช้วิธี % ลูกหนี้)?","options":["18,000 บาท","23,000 บาท","9,000 บาท","13,000 บาท"],"answer":3,"explanation":"ค่าเผื่อที่ต้องมี = 900,000×2%=18,000 บาท มีอยู่ 5,000 จึงเพิ่ม 13,000 บาท","visual":""},{"id":"fin-015","bank":"fin","cat":"1. หลักการบัญชี","prompt":"บัญชีใดเป็นรายการในงบฐานะการเงิน ไม่ใช่งบกำไรขาดทุน?","options":["รายได้ค่าบริการ","ค่าใช้จ่ายดอกเบี้ย","เจ้าหนี้การค้า","ต้นทุนขาย"],"answer":2,"explanation":"เจ้าหนี้การค้าเป็นหนี้สิน ณ วันสิ้นงวด อยู่ในงบฐานะการเงิน","visual":""},{"id":"fin-016","bank":"fin","cat":"1. หลักการบัญชี","prompt":"รายการใดมีผลทำให้กำไรสุทธิของงวดลดลง?","options":["รับชำระลูกหนี้การค้า","ตั้งค่าใช้จ่ายค้างจ่ายที่เป็นของงวด","กู้เงินจากธนาคาร","ออกหุ้นเพิ่มทุน"],"answer":1,"explanation":"ค่าใช้จ่ายที่ยังไม่บันทึกทำให้ค่าใช้จ่ายงวดเพิ่มและกำไรลด","visual":""},{"id":"fin-017","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ธุรกิจมีรายได้ 1,200,000 บาท ต้นทุนขาย 720,000 บาท ค่าใช้จ่ายขายและบริหาร 210,000 บาท ดอกเบี้ยจ่าย 30,000 บาท และภาษีเงินได้ 48,000 บาท กำไรสุทธิเท่าไร?","options":["192,000 บาท","240,000 บาท","270,000 บาท","480,000 บาท"],"answer":0,"explanation":"1,200,000 - 720,000 - 210,000 - 30,000 - 48,000 = 192,000 บาท","visual":""},{"id":"fin-018","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ข้อใดเป็นบัญชีชั่วคราวที่ต้องปิดบัญชีเมื่อสิ้นงวด?","options":["อาคาร","เจ้าหนี้การค้า","ทุน","รายได้ค่าธรรมเนียม"],"answer":3,"explanation":"รายได้เป็นบัญชีชั่วคราว ต้องปิดเข้ากำไรสะสม/ทุน ขณะที่อาคาร หนี้สิน และทุนเป็นบัญชีถาวร","visual":""},{"id":"fin-019","bank":"fin","cat":"1. หลักการบัญชี","prompt":"กิจการมีกำไรสุทธิ 180,000 บาท และจ่ายเงินปันผล 45,000 บาท ในงวดนี้ กำไรสะสมเพิ่มสุทธิเท่าไร (ไม่รวมรายการอื่น)?","options":["225,000 บาท","135,000 บาท","180,000 บาท","45,000 บาท"],"answer":1,"explanation":"กำไรสะสมเพิ่มจากกำไรสุทธิและลดจากเงินปันผล = 180,000 - 45,000 = 135,000 บาท","visual":""},{"id":"fin-020","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ภายใต้การจัดประเภทธุรกรรมทั่วไปสำหรับกิจการที่ไม่ใช่สถาบันการเงิน การซื้อเครื่องจักรด้วยเงินสดอยู่ในกระแสเงินสดกิจกรรมใด?","options":["ดำเนินงาน","จัดหาเงิน","ลงทุน","ไม่ต้องแสดงในงบกระแสเงินสด"],"answer":2,"explanation":"เงินสดจ่ายซื้อสินทรัพย์ถาวรเป็นกิจกรรมลงทุน ทั้งนี้การจัดประเภทของสถาบันการเงินบางรายการอาจต่างตามมาตรฐาน","visual":""},{"id":"fin-021","bank":"fin","cat":"1. หลักการบัญชี","prompt":"สินทรัพย์หมุนเวียน 540,000 บาท หนี้สินหมุนเวียน 360,000 บาท หากจ่ายเจ้าหนี้ด้วยเงินสด 90,000 บาท อัตราส่วนทุนหมุนเวียนใหม่ประมาณเท่าไร?","options":["1.67 เท่า","1.25 เท่า","1.50 เท่า","2.00 เท่า"],"answer":0,"explanation":"หลังจ่าย สินทรัพย์หมุนเวียน 450,000 และหนี้สินหมุนเวียน 270,000 อัตรา = 450,000/270,000 ≈1.67","visual":""},{"id":"fin-022","bank":"fin","cat":"1. หลักการบัญชี","prompt":"สินทรัพย์รวม 3.6 ล้านบาท หนี้สินรวม 2.4 ล้านบาท อัตราส่วนหนี้สินต่อส่วนของเจ้าของ (D/E) เท่ากับเท่าไร?","options":["0.67 เท่า","1.50 เท่า","2.00 เท่า","3.00 เท่า"],"answer":2,"explanation":"ส่วนของเจ้าของ = 3.6 - 2.4 = 1.2 ล้านบาท ดังนั้น D/E = 2.4/1.2 = 2 เท่า","visual":""},{"id":"fin-023","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ยอดขาย 2,500,000 บาท ต้นทุนขาย 1,750,000 บาท กำไรขั้นต้นคิดเป็นกี่เปอร์เซ็นต์ของยอดขาย?","options":["20%","30%","42.9%","70%"],"answer":1,"explanation":"กำไรขั้นต้น = 750,000 บาท / ยอดขาย 2,500,000 = 30%","visual":""},{"id":"fin-024","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ต้นทุนคงที่ 240,000 บาท ราคาขายต่อหน่วย 120 บาท ต้นทุนผันแปรต่อหน่วย 80 บาท จุดคุ้มทุนเท่ากับกี่หน่วย?","options":["2,000 หน่วย","3,000 หน่วย","4,000 หน่วย","6,000 หน่วย"],"answer":3,"explanation":"ส่วนเกินเพื่อการสมทบต่อหน่วย=120-80=40 บาท จุดคุ้มทุน=240,000/40=6,000 หน่วย","visual":""},{"id":"fin-025","bank":"fin","cat":"1. หลักการบัญชี","prompt":"สินค้ามีราคาขาย 500 บาท ต้นทุนผันแปร 320 บาทต่อหน่วย ขายได้ 1,500 หน่วย และมีต้นทุนคงที่ 180,000 บาท กำไรจากการดำเนินงานเป็นเท่าไร?","options":["90,000 บาท","270,000 บาท","180,000 บาท","450,000 บาท"],"answer":0,"explanation":"กำไร = (500-320)×1,500 - 180,000 = 90,000 บาท","visual":""},{"id":"fin-026","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ข้อใดเป็นต้นทุนทางตรงของการผลิตข้าวบรรจุถุง?","options":["เงินเดือนผู้จัดการสำนักงานใหญ่","ค่าโฆษณาของบริษัท","ค่าข้าวสารที่ใช้บรรจุถุง","ค่าเช่าสำนักงานขาย"],"answer":2,"explanation":"วัตถุดิบที่ใช้โดยตรงในผลิตภัณฑ์เป็นวัตถุดิบทางตรง","visual":""},{"id":"fin-027","bank":"fin","cat":"1. หลักการบัญชี","prompt":"แผนกผลิตมีต้นทุนผันแปร 35 บาทต่อหน่วย ต้นทุนคงที่ 150,000 บาท และผลิต 10,000 หน่วย ต้นทุนผลิตรวมเฉลี่ยต่อหน่วยเท่าไร?","options":["35 บาท","50 บาท","65 บาท","150 บาท"],"answer":1,"explanation":"ต้นทุนรวม = 35×10,000 + 150,000 = 500,000 บาท หาร 10,000 หน่วย ได้ 50 บาท","visual":""},{"id":"fin-028","bank":"fin","cat":"1. หลักการบัญชี","prompt":"สินค้าคงเหลือเฉลี่ย 200,000 บาท ต้นทุนขายต่อปี 1,600,000 บาท อัตราหมุนเวียนสินค้าคงเหลือเป็นเท่าไร?","options":["4 รอบ","6 รอบ","10 รอบ","8 รอบ"],"answer":3,"explanation":"อัตราหมุนเวียน = ต้นทุนขาย/สินค้าคงเหลือเฉลี่ย = 1,600,000/200,000 = 8 รอบ","visual":""},{"id":"fin-029","bank":"fin","cat":"1. หลักการบัญชี","prompt":"กิจการมีอัตราหมุนเวียนลูกหนี้ 9 รอบต่อปี หากใช้ 360 วัน ระยะเวลาเก็บหนี้เฉลี่ยประมาณกี่วัน?","options":["40 วัน","30 วัน","45 วัน","90 วัน"],"answer":0,"explanation":"360/9 = 40 วัน","visual":""},{"id":"fin-030","bank":"fin","cat":"1. หลักการบัญชี","prompt":"ข้อใดสะท้อนความเสี่ยงสภาพคล่องได้ดีที่สุด เมื่อปัจจัยอื่นคงที่?","options":["อัตราส่วนทุนหมุนเวียนเพิ่ม","เงินสดจากการดำเนินงานเป็นบวกต่อเนื่อง","ภาระหนี้ระยะสั้นเพิ่มเร็วกว่าเงินสดและสินทรัพย์สภาพคล่อง","ระยะเวลาเก็บหนี้สั้นลง"],"answer":2,"explanation":"ภาระหนี้ระยะสั้นที่เพิ่มเร็วกว่าสภาพคล่องทำให้ความสามารถชำระหนี้ระยะสั้นอ่อนลง","visual":""},{"id":"fin-031","bank":"fin","cat":"1. หลักการบัญชี","prompt":"TFRS 9 เกี่ยวข้องโดยตรงกับเรื่องใดมากที่สุด?","options":["การรับรู้รายได้จากสัญญากับลูกค้า","เครื่องมือทางการเงินและผลขาดทุนด้านเครดิตที่คาดว่าจะเกิดขึ้น (ECL)","สัญญาเช่าทรัพย์สิน","ภาษีเงินได้รอการตัดบัญชี"],"answer":1,"explanation":"TFRS 9 ว่าด้วยเครื่องมือทางการเงิน รวมถึงการรับรู้และวัดมูลค่าผลขาดทุนด้านเครดิตที่คาดว่าจะเกิดขึ้น","visual":""},{"id":"fin-032","bank":"fin","cat":"1. หลักการบัญชี","prompt":"แนวคิดหลักของ TFRS 15 คือข้อใด?","options":["รับรู้รายได้เฉพาะวันที่ได้เงินสด","รับรู้รายได้เมื่อออกใบเสนอราคา","รับรู้รายได้เมื่อได้รับคำสั่งซื้อเสมอ","รับรู้รายได้เมื่อปฏิบัติตามภาระที่ต้องปฏิบัติและโอนการควบคุมสินค้าหรือบริการให้ลูกค้า"],"answer":3,"explanation":"TFRS 15 มุ่งให้รับรู้รายได้เมื่อการควบคุมสินค้าหรือบริการโอนไปยังลูกค้าตามภาระที่ต้องปฏิบัติ","visual":""},{"id":"fin-033","bank":"fin","cat":"1. หลักการบัญชี","prompt":"สินค้าคงเหลือมีราคาทุน 320,000 บาท แต่มูลค่าสุทธิที่จะได้รับ (NRV) ณ สิ้นปี 295,000 บาท ตามหลักการตีมูลค่าของ TAS 2 ควรแสดงที่จำนวนใด?","options":["295,000 บาท","320,000 บาท","307,500 บาท","ต้องรอให้ขายจริงก่อน"],"answer":0,"explanation":"สินค้าคงเหลือวัดมูลค่าด้วยราคาทุนหรือ NRV แล้วแต่จำนวนใดต่ำกว่า จึงเป็น 295,000 บาท","visual":""},{"id":"fin-034","bank":"fin","cat":"1. หลักการบัญชี","prompt":"รายการใดมีลักษณะเป็นเหตุการณ์หลังรอบระยะเวลารายงานที่อาจต้องปรับปรุงตัวเลข หากให้หลักฐานเพิ่มเติมเกี่ยวกับสภาพที่มีอยู่ ณ วันสิ้นงวด?","options":["ประกาศแผนขยายธุรกิจครั้งใหม่หลังวันสิ้นงวด","เกิดอุทกภัยครั้งใหม่ภายหลังวันสิ้นงวด","ได้รับข้อยุติคดีความหลังสิ้นงวดที่ยืนยันภาระหนี้ซึ่งมีอยู่แล้วก่อนสิ้นงวด","ผู้ถือหุ้นเสนอเข้าซื้อกิจการใหม่ภายหลังวันสิ้นงวด"],"answer":2,"explanation":"TAS 10 แยกเหตุการณ์ที่ให้หลักฐานเกี่ยวกับสภาพ ณ วันสิ้นงวด (ปรับปรุง) กับเหตุการณ์ใหม่ภายหลัง (ไม่ปรับปรุง)","visual":""},{"id":"fin-035","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ธุรกิจออกหุ้นสามัญเพิ่มทุนและขายให้นักลงทุนเป็นครั้งแรก ธุรกรรมเกิดในตลาดใด?","options":["ตลาดรอง","ตลาดแรก","ตลาดเงิน","ตลาดอนุพันธ์"],"answer":1,"explanation":"การออกหลักทรัพย์ใหม่เพื่อระดมทุนเป็นตลาดแรก (primary market)","visual":""},{"id":"fin-036","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ตราสารใดโดยทั่วไปอยู่ในตลาดเงิน?","options":["หุ้นสามัญ","หุ้นบุริมสิทธิ","พันธบัตรอายุ 20 ปี","ตั๋วเงินคลังระยะสั้น"],"answer":3,"explanation":"ตลาดเงินเน้นตราสารหนี้ระยะสั้นและสภาพคล่อง เช่น ตั๋วเงินคลัง","visual":""},{"id":"fin-037","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"เมื่ออัตราดอกเบี้ยตลาดเพิ่มขึ้นอย่างรวดเร็ว ราคาพันธบัตรที่จ่ายคูปองคงที่ในตลาดรองโดยทั่วไปจะเป็นอย่างไร?","options":["ลดลง","เพิ่มขึ้น","ไม่เปลี่ยนแปลง","เพิ่มขึ้นเท่ากับอัตราดอกเบี้ย"],"answer":0,"explanation":"ราคาพันธบัตรคูปองคงที่เคลื่อนไหวสวนทางกับอัตราผลตอบแทนที่ตลาดต้องการ","visual":""},{"id":"fin-038","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ประโยชน์หลักของตลาดรองต่อผู้ลงทุนคืออะไร?","options":["ทำให้ผู้ออกหลักทรัพย์ได้รับเงินใหม่ทุกครั้งที่ซื้อขาย","ประกันว่าการลงทุนจะไม่ขาดทุน","เพิ่มสภาพคล่องให้ซื้อขายหลักทรัพย์ที่ออกแล้วได้","ยกเว้นภาษีทุกประเภท"],"answer":2,"explanation":"ตลาดรองช่วยให้ผู้ถือหลักทรัพย์เปลี่ยนมือได้สะดวก ไม่ได้หมายความว่าผู้ออกได้รับเงินใหม่ทุกครั้ง","visual":""},{"id":"fin-039","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ในงบดุลของธนาคาร เงินรับฝากจากลูกค้าโดยทั่วไปจัดเป็นรายการใด?","options":["สินทรัพย์","หนี้สิน","ส่วนของเจ้าของ","รายได้"],"answer":1,"explanation":"เงินฝากเป็นภาระผูกพันของธนาคารที่จะจ่ายคืนผู้ฝาก จึงเป็นหนี้สินของธนาคาร","visual":""},{"id":"fin-040","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ลูกค้าฝากเงินสด 40,000 บาทเข้าบัญชีออมทรัพย์ หากพิจารณาเฉพาะรายการนี้ งบดุลของธนาคารเปลี่ยนแปลงอย่างไร?","options":["สินทรัพย์เพิ่ม และหนี้สินเพิ่ม 40,000 บาท","สินทรัพย์ลดและหนี้สินลด 40,000 บาท","รายได้ดอกเบี้ยเพิ่ม 40,000 บาท","กำไรสะสมเพิ่ม 40,000 บาท"],"answer":0,"explanation":"ธนาคารมีเงินสดเพิ่มพร้อมภาระต้องคืนเงินฝากเพิ่ม ไม่เกิดรายได้ทันที","visual":""},{"id":"fin-041","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ข้อใดเป็นมาตรการลดความเสี่ยงเมื่อพบว่าลูกค้าได้รับ SMS ขอ OTP เพื่อยืนยันการโอนเงินที่ไม่ได้ทำ?","options":["ให้ OTP เพื่อป้องกันถูกระงับบัญชี","กดลิงก์ตรวจสอบทันที","ใช้ OTP ร่วมกับเจ้าหน้าที่ที่โทรเข้ามา","ไม่เปิดเผย OTP และติดต่อธนาคารผ่านช่องทางทางการ"],"answer":3,"explanation":"OTP เป็นข้อมูลยืนยันตัวตน ห้ามเปิดเผยแก่ผู้อื่นและควรตรวจสอบผ่านช่องทางที่ยืนยันได้","visual":""},{"id":"fin-042","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ธุรกรรมใดมีความเสี่ยงจากการชำระบัญชีไม่เสร็จสมบูรณ์ (settlement risk) เป็นประเด็นสำคัญ?","options":["อ่านข้อมูลผลิตภัณฑ์จากเว็บ","ตรวจยอดบัญชีจากสมุดบัญชี","โอนเงินระหว่างสถาบันการเงินที่ต้องมีการชำระดุล","ขอเปลี่ยนที่อยู่ติดต่อ"],"answer":2,"explanation":"ธุรกรรมระหว่างธนาคารต้องมีการชำระดุลจริง จึงมีความเสี่ยงด้านการชำระบัญชี","visual":""},{"id":"fin-043","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ข้อใดอธิบายความแตกต่างระหว่างบัตรเดบิตกับบัตรเครดิตได้ถูกต้องที่สุด?","options":["บัตรเดบิตให้สินเชื่อเสมอ","บัตรเดบิตใช้เงินจากบัญชีที่เชื่อมโยง ขณะที่บัตรเครดิตใช้วงเงินสินเชื่อ","บัตรเครดิตไม่ก่อภาระหนี้","บัตรเดบิตใช้กับเครื่อง ATM ไม่ได้"],"answer":1,"explanation":"บัตรเดบิตหักเงินที่มีในบัญชี ส่วนบัตรเครดิตเป็นวงเงินที่ผู้ถือบัตรต้องชำระคืน","visual":""},{"id":"fin-044","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ตั๋วเงินอายุ 1 ปี มูลค่าหน้าตั๋ว 100,000 บาท ซื้อที่ราคา 96,000 บาทและถือจนครบกำหนด อัตราผลตอบแทนแบบคำนวณจากราคาซื้อประมาณเท่าไร?","options":["4.00%","3.85%","4.17%","4.50%"],"answer":2,"explanation":"ส่วนต่างรับ=4,000 บาท เทียบเงินลงทุน 96,000 = 4.1667%","visual":""},{"id":"fin-045","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ผู้ลงทุนซื้อพันธบัตรรัฐบาลโดยตรง ความเสี่ยงใดยังคงมีอยู่แม้ไม่คิดประเด็นการผิดนัดชำระ?","options":["ความเสี่ยงราคาจากการเปลี่ยนแปลงอัตราดอกเบี้ย","ไม่มีความเสี่ยงใด ๆ","ความเสี่ยงว่าเงินฝากถูกอายัดเสมอ","ความเสี่ยงจากการถือหุ้นสามัญเท่านั้น"],"answer":0,"explanation":"ราคาพันธบัตรเปลี่ยนตามผลตอบแทนตลาดหากขายก่อนครบกำหนด","visual":""},{"id":"fin-046","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"กองทุนรวมมีสินทรัพย์สุทธิ 525 ล้านบาท และหน่วยลงทุนคงค้าง 35 ล้านหน่วย NAV ต่อหน่วยเท่ากับเท่าไร?","options":["12 บาท","13 บาท","14 บาท","15 บาท"],"answer":3,"explanation":"NAV/หน่วย = 525/35 = 15 บาท","visual":""},{"id":"fin-047","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"การกระจายลงทุนในหุ้นหลายอุตสาหกรรมช่วยลดความเสี่ยงประเภทใดได้มากที่สุด?","options":["ความเสี่ยงระบบตลาดทั้งหมด","ความเสี่ยงเฉพาะบริษัท/เฉพาะกิจการ","ความเสี่ยงเงินเฟ้อที่หลีกเลี่ยงไม่ได้","ความเสี่ยงดอกเบี้ยทุกชนิด"],"answer":1,"explanation":"การกระจายลงทุนช่วยลด unsystematic risk แต่ไม่กำจัด systematic risk ทั้งหมด","visual":""},{"id":"fin-048","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ตราสารหนี้ที่มีดอกเบี้ยลอยตัวโดยทั่วไปมีลักษณะสำคัญใด?","options":["อัตราคูปองไม่เปลี่ยนตลอดอายุ","ไม่มีความเสี่ยงผู้กู้ผิดนัด","อัตราดอกเบี้ยปรับตามอัตราอ้างอิงตามเงื่อนไข","ผู้ถือได้รับสิทธิออกเสียงเหมือนหุ้นสามัญ"],"answer":2,"explanation":"floating rate note ปรับคูปองตามดัชนีอ้างอิงที่กำหนด ไม่ได้ทำให้ปลอดความเสี่ยงเครดิต","visual":""},{"id":"fin-049","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ฝากเงิน 200,000 บาท อัตราดอกเบี้ยอย่างง่าย 2.4% ต่อปี เป็นเวลา 9 เดือน ดอกเบี้ยก่อนภาษีเท่าไร?","options":["3,600 บาท","4,800 บาท","5,400 บาท","6,000 บาท"],"answer":0,"explanation":"200,000×0.024×9/12 = 3,600 บาท","visual":""},{"id":"fin-050","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"เงินต้น 100,000 บาท ดอกเบี้ยทบต้น 5% ต่อปี เมื่อครบ 2 ปีจะมีเงินรวมเท่าไร?","options":["105,000 บาท","110,000 บาท","110,500 บาท","110,250 บาท"],"answer":3,"explanation":"100,000×1.05² = 110,250 บาท","visual":""},{"id":"fin-051","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"เงิน 121,000 บาทที่จะได้รับในอีก 2 ปี หากใช้อัตราคิดลด 10% ต่อปี มูลค่าปัจจุบันเท่าไร?","options":["99,000 บาท","100,000 บาท","110,000 บาท","101,000 บาท"],"answer":1,"explanation":"PV=121,000/(1.10)²=100,000 บาท","visual":""},{"id":"fin-052","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ลงทุน 400,000 บาท ได้กำไรจากการลงทุน 36,000 บาทในหนึ่งปี โดยไม่พิจารณาการเปลี่ยนมูลค่าสินทรัพย์ อัตราผลตอบแทนเท่าไร?","options":["6%","8%","9%","12%"],"answer":2,"explanation":"36,000 / 400,000 = 9%","visual":""},{"id":"fin-053","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"โครงการลงทุน 500,000 บาท รับเงินสดปลายปีที่ 1 จำนวน 300,000 บาท และปลายปีที่ 2 จำนวน 300,000 บาท อัตราคิดลด 10% NPV ประมาณเท่าไร?","options":["20,661 บาท","45,455 บาท","100,000 บาท","ขาดทุน 20,661 บาท"],"answer":0,"explanation":"NPV = -500,000 + 300,000/1.1 + 300,000/1.1² ≈ 20,661 บาท","visual":""},{"id":"fin-054","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ธนาคารเสนอเงินกู้ผ่อนชำระเท่ากันทุกเดือนแบบลดต้นลดดอก เมื่อยอดเงินต้นคงเหลือลดลง โดยอัตราดอกเบี้ยคงที่ ส่วนของค่างวดที่เป็นดอกเบี้ยจะเป็นอย่างไร?","options":["เพิ่มขึ้นต่อเนื่อง","คงที่เสมอ","เท่ากับเงินต้นทุกเดือน","ลดลงโดยทั่วไป"],"answer":3,"explanation":"ดอกเบี้ยแต่ละงวดคิดจากเงินต้นคงเหลือ เมื่อเงินต้นลด ดอกเบี้ยลดและส่วนที่ชำระเงินต้นเพิ่ม","visual":""},{"id":"fin-055","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"สินเชื่อวงเงิน 360,000 บาท อัตราดอกเบี้ย 8% ต่อปี คิดดอกเบี้ยอย่างง่ายตามยอดเงินต้นเต็มจำนวนเป็นเวลา 45 วัน (สมมติปี 360 วัน) ดอกเบี้ยเท่าไร?","options":["2,880 บาท","3,600 บาท","4,000 บาท","28,800 บาท"],"answer":1,"explanation":"360,000×0.08×45/360 = 3,600 บาท","visual":""},{"id":"fin-056","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"หากอัตราดอกเบี้ยระบุ 12% ต่อปี ทบต้นรายเดือน อัตราดอกเบี้ยที่แท้จริงต่อปี (EAR) ประมาณเท่าไร?","options":["12.00%","12.36%","12.68%","13.20%"],"answer":2,"explanation":"EAR = (1+0.12/12)^12 -1 ≈ 12.68%","visual":""},{"id":"fin-057","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ความเสี่ยงที่ธนาคารไม่สามารถจัดหาเงินสดมาชำระภาระที่ถึงกำหนดโดยไม่เกิดต้นทุนสูงผิดปกติ คือความเสี่ยงใด?","options":["ความเสี่ยงสภาพคล่อง","ความเสี่ยงชื่อเสียง","ความเสี่ยงอัตราแลกเปลี่ยนเท่านั้น","ความเสี่ยงปฏิบัติตามกฎหมายเท่านั้น"],"answer":0,"explanation":"Liquidity risk คือความเสี่ยงด้านการมีเงินสดหรือระดมทุนเพื่อชำระภาระทันเวลา","visual":""},{"id":"fin-058","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ธนาคารรับเงินฝากอายุสั้นจำนวนมาก แต่ปล่อยสินเชื่ออัตราคงที่ระยะยาวจำนวนมาก เมื่อดอกเบี้ยตลาดเพิ่มขึ้นเร็ว ธนาคารอาจเผชิญปัญหาใด?","options":["รายได้ดอกเบี้ยเพิ่มทันทีเท่าต้นทุนเสมอ","ไม่มีผลเพราะเงินฝากไม่ใช่หนี้สิน","ต้นทุนเงินฝากปรับขึ้นเร็วกว่าอัตราผลตอบแทนสินเชื่อ ทำให้ส่วนต่างดอกเบี้ยถูกกดดัน","เงินต้นเงินกู้จะหายไปทั้งหมด"],"answer":2,"explanation":"อายุการปรับอัตราดอกเบี้ยสินทรัพย์กับหนี้สินไม่ตรงกัน ทำให้เกิด interest rate risk ใน banking book","visual":""},{"id":"fin-059","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ความเสี่ยงปฏิบัติการ (Operational Risk) ตัวอย่างที่ชัดเจนคือข้อใด?","options":["อัตราดอกเบี้ยนโยบายลด","ราคาข้าวเปลี่ยนตามตลาด","ลูกค้ามีรายได้ลดจากภัยแล้ง","พนักงานคีย์เลขบัญชีผิดจนโอนไปผิดผู้รับ"],"answer":3,"explanation":"ความผิดพลาดของบุคลากร/กระบวนการ/ระบบเป็นความเสี่ยงปฏิบัติการ","visual":""},{"id":"fin-060","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ในการวิเคราะห์เครดิตตามแนวคิด 5C หากดูความสามารถสร้างกระแสเงินสดเพื่อผ่อนชำระหนี้ เป็นการประเมินด้านใด?","options":["Character","Capacity","Collateral","Conditions"],"answer":1,"explanation":"Capacity เน้นรายได้และกระแสเงินสดเพื่อชำระหนี้","visual":""},{"id":"fin-061","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ลูกค้ามีรายได้สุทธิหลังหักค่าใช้จ่ายจำเป็นเดือนละ 32,000 บาท และต้องผ่อนหนี้เดิม 12,000 บาท กับหนี้ใหม่ 8,000 บาทต่อเดือน สัดส่วนภาระผ่อนต่อรายได้สุทธิที่โจทย์กำหนดเท่าไร?","options":["50%","55%","62.5%","75%"],"answer":2,"explanation":"(12,000+8,000)/32,000 = 62.5% เป็นเพียงสัดส่วนตามนิยามที่โจทย์กำหนด ไม่ใช่เกณฑ์อนุมัติของธนาคาร","visual":""},{"id":"fin-062","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"หลักประกันประเมินได้ 1,500,000 บาท วงเงินสินเชื่อ 900,000 บาท LTV เท่าไร?","options":["60%","67%","75%","90%"],"answer":0,"explanation":"LTV = 900,000/1,500,000 = 60%","visual":""},{"id":"fin-063","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"ลูกค้าต้องการเก็บเงินระยะยาวแต่ยังต้องการความมั่นคงของเงินต้นและไม่ต้องการความผันผวนจากหุ้น ผลิตภัณฑ์ใดโดยหลักเหมาะสำหรับเริ่มเปรียบเทียบเงื่อนไขมากที่สุด?","options":["หุ้นเก็งกำไรรายวัน","สัญญาอนุพันธ์ที่มีเลเวอเรจ","เงินลงทุนในสินทรัพย์ดิจิทัลความเสี่ยงสูง","เงินฝากประจำที่มีเงื่อนไขถอนและผลตอบแทนชัดเจน"],"answer":3,"explanation":"เงินฝากประจำมีเงื่อนไขผลตอบแทนและความเสี่ยงต่างจากสินทรัพย์ผันผวนสูง แต่ยังต้องดูเงื่อนไขจริง","visual":""},{"id":"fin-064","bank":"fin","cat":"2. การเงิน การธนาคารและสินเชื่อ","prompt":"จากผลิตภัณฑ์ที่เว็บไซต์ ธ.ก.ส. เผยแพร่ สินเชื่อเพื่อผู้ใช้บริการเงินฝาก ธ.ก.ส. ใช้สินทรัพย์ใดเป็นหลักประกันตามแนวคิดหลักของผลิตภัณฑ์?","options":["หุ้นสามัญต่างประเทศเท่านั้น","เงินฝากหรือสลากออมทรัพย์ของผู้ใช้บริการ","ที่ดินเกษตรทุกกรณี","รถยนต์เท่านั้น"],"answer":1,"explanation":"ผลิตภัณฑ์นี้ใช้เงินฝากหรือสลากออมทรัพย์ที่เข้าเงื่อนไขเป็นหลักประกัน (รายละเอียดเป็นไปตามธนาคารกำหนด)","visual":""},{"id":"fin-065","bank":"fin","cat":"3. เศรษฐศาสตร์","prompt":"เกษตรกรมีที่ดินผืนเดียว เลือกปลูกข้าวแทนปลูกอ้อย ต้นทุนค่าเสียโอกาสของการปลูกข้าวหมายถึงอะไร?","options":["ค่าปุ๋ยของข้าวเท่านั้น","ค่าจ้างคนปลูกข้าว","ผลประโยชน์จากทางเลือกปลูกอ้อยที่ดีที่สุดซึ่งต้องสละไป","ราคาข้าวที่ขายได้ทั้งหมด"],"answer":2,"explanation":"Opportunity cost คือคุณค่าของทางเลือกที่ดีที่สุดที่ไม่ได้เลือก","visual":""},{"id":"fin-066","bank":"fin","cat":"3. เศรษฐศาสตร์","prompt":"ถ้าเกิดภัยแล้งรุนแรงทำให้ผลผลิตข้าวลดลง โดยความต้องการซื้อคงเดิม ตามทฤษฎีอุปสงค์–อุปทาน ราคาดุลยภาพข้าวมีแนวโน้มเป็นอย่างไร?","options":["เพิ่มขึ้น","ลดลง","เป็นศูนย์","ไม่เปลี่ยนเสมอ"],"answer":0,"explanation":"อุปทานเลื่อนซ้าย ราคาดุลยภาพมีแนวโน้มสูงขึ้นและปริมาณลดลง","visual":""},{"id":"fin-067","bank":"fin","cat":"3. เศรษฐศาสตร์","prompt":"ธนาคารกลางขึ้นอัตราดอกเบี้ยนโยบายเพื่อควบคุมเงินเฟ้อ กลไกตามปกติคือข้อใด?","options":["ทำให้การกู้ยืมถูกลงและกระตุ้นบริโภค","เพิ่มปริมาณเงินโดยตรงเสมอ","ลดต้นทุนทางการเงินภาคเอกชน","เพิ่มต้นทุนการกู้และชะลออุปสงค์โดยรวม"],"answer":3,"explanation":"อัตราดอกเบี้ยสูงขึ้นมีแนวโน้มกดการบริโภคและลงทุนที่ใช้สินเชื่อ","visual":""},{"id":"fin-068","bank":"fin","cat":"3. เศรษฐศาสตร์","prompt":"อัตราดอกเบี้ยเงินฝาก 3% ต่อปี และเงินเฟ้อ 5% ต่อปี อัตราดอกเบี้ยที่แท้จริงโดยประมาณเท่าไร?","options":["+8%","-2%","+2%","-8%"],"answer":1,"explanation":"Real interest approximation = nominal interest - inflation = 3%-5% = -2%","visual":""},{"id":"fin-069","bank":"fin","cat":"3. เศรษฐศาสตร์","prompt":"ข้อใดนับรวมใน GDP ของไทยปีปัจจุบันตามแนวคิดการผลิตขั้นสุดท้าย?","options":["รถยนต์มือสองผลิตปีก่อนที่ขายต่อ","การซื้อขายหุ้นในตลาดหลักทรัพย์","ข้าวสารที่ผลิตปีนี้เพื่อขายให้ผู้บริโภคขั้นสุดท้ายในประเทศ","เงินโอนช่วยเหลือจากรัฐที่ไม่ใช่ค่าผลิตสินค้า"],"answer":2,"explanation":"GDP นับมูลค่าสินค้าและบริการขั้นสุดท้ายที่ผลิตในช่วงเวลานั้นภายในประเทศ","visual":""},{"id":"fin-070","bank":"fin","cat":"3. เศรษฐศาสตร์","prompt":"เมื่อราคาสินค้าเพิ่มขึ้น 10% และปริมาณเสนอซื้อลดลง 20% ความยืดหยุ่นอุปสงค์ต่อราคาแบบจุดประมาณมีค่าสัมบูรณ์เท่าใด?","options":["2.0","0.5","1.0","3.0"],"answer":0,"explanation":"ค่าสัมบูรณ์ความยืดหยุ่น≈20% ng","prompt":"“Mina saved 500 baht every month.” Mina ทำอะไรทุกเดือน?","options":["ถอนเงิน 500 บาท","เก็บเงิน 500 บาท","ใช้เงิน 500 บาท","ยืมเงิน 500 บาท"],"answer":1,"explanation":"Saved หมายถึงเก็บออม","visual":""},{"id":"fe-019","bank":"fe","cat":"Reading","prompt":"“The application deadline is Friday.” สมัครได้ถึงวันใด?","options":["Monday","Wednesday","Friday","Sunday"],"answer":2,"explanation":"Deadline is Friday = กำหนดสิ้นสุดวันศุกร์","visual":""},{"id":"fe-020","bank":"fe","cat":"Reading","prompt":"“Applicants must bring an ID card.” ต้องนำอะไรมา?","options":["สมุดบัญชี","บัตรประชาชน","บัตรเครดิต","สำเนาทะเบียนบ้าน"],"answer":1,"explanation":"ID card คือบัตรประจำตัวประชาชน","visual":""}];

<script>

const STORE='baac-quest-academy-v1';

const TH=['ก','ข','ค','ง','จ'];
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const all=(prefix)=>BANK.filter(q=>q.bank===prefix);
const dateStr=(date=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
const today=dateStr();
const defaultState=()=>({xp:0,streak:0,lastDay:'',dailyDone:'',track:'biz',seen:[],records:[],wrong:{},sessions:[],reports:[],history:[],earned:{}});
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch(e){return fallback}}
let state={...defaultState(),...load(STORE,{})};
let session=load(SESSION_STORE,null);
let page='home';let resultFilter='all';
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));if(session)localStorage.setItem(SESSION_STORE,JSON.stringify(session));else localStorage.removeItem(SESSION_STORE)}catch(e){console.warn('storage unavailable',e)}}
function e(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function xpLevel(){return Math.floor(Math.sqrt(state.xp/65))+1}
function levelProg(){let lv=xpLevel(),start=65*(lv-1)*(lv-1),end=65*lv*lv;return {percent:Math.min(100,Math.max(0,Math.round((state.xp-start)/(end-start)*100))),remaining:end-state.xp,lv}}
function go(where){page=where;window.scrollTo({top:0,behavior:'instant'});render()}
function toast(message){const target=document.getElementById('toasts');target.innerHTML=`<div class="toast">${e(message)}</div>`;setTimeout(()=>{target.innerHTML=''},2600)}
function celebrate(){let colors=['#ff91bd','#ffd15f','#85a9ff','#72d9bc','#c4a2ff'];for(let i=0;i<30;i++){let p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.top=Math.random()*20+'vh';p.style.background=colors[i%5];p.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),1700)}}
function render(){document.getElementById('header-xp').textContent=state.xp+' XP';document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===page));if(session&&session.mode==='mock'&&session.endsAt&&Date.now()>=session.endsAt){finishSession(true);return}ROOT.innerHTML=page==='home'?home():page==='learn'?learn():page==='exams'?exams():page==='stats'?stats():page==='quiz'?quiz():page==='result'?results():home();if(page==='quiz')tickTimer()}

const worlds=[
{key:'fm',title:'เกาะคณิตเริ่มต้น',icon:'🍰',subtitle:'เริ่มจากบวก ลบ ร้อยละ และดอกเบี้ย',bg:'#fff0e9',count:20},
{key:'fe',title:'สวนอังกฤษแสนสนุก',icon:'🧁',subtitle:'ศัพท์ง่าย ๆ และ Grammar ทีละนิด',bg:'#f8edff',count:20},
{key:'math',title:'เมืองตัวเลข',icon:'🧮',subtitle:'คณิตศาสตร์ Aptitude',bg:'#e9f8ff',count:20},

{key:'reason',title:'ป่าแห่งเหตุผล',icon:'🦊',subtitle:'ฝึกตรรกะและความสัมพันธ์',bg:'#e6faef',count:20},
{key:'thai',title:'เกาะภาษาไทย',icon:'🪷',subtitle:'จับใจความและเลือกใช้ภาษา',bg:'#f6ecfa',count:16},
{key:'spatial',title:'ปราสาทมิติ',icon:'🧩',subtitle:'หมุนภาพและจินตนาการรูปทรง',bg:'#e9eefa',count:12},
{key:'acc',title:'นครนักสังเกต',icon:'🔎',subtitle:'จับผิดภาพและข้อความขาวดำ',bg:'#fff0f3',count:60},
{key:'biz',title:'ฟาร์มสินเชื่อ',icon:'🌾',subtitle:'เฉพาะตำแหน่งพัฒนาธุรกิจ',bg:'#f0f8df',count:100},
{key:'fin',title:'ธนาคารลูกกวาด',icon:'🏦',subtitle:'เฉพาะตำแหน่งการเงิน',bg:'#e7f4fa',count:100}
];
function getPool(key){const aptitude=all('apt');switch(key){case 'fm':case 'fe':case 'acc':case 'biz':case 'fin':return all(key);case 'math':return aptitude.filter(q=>q.cat==='คณิตศาสตร์');case 'english':return aptitude.filter(q=>q.cat==='ภาษาอังกฤษ');case 'reason':return aptitude.filter(q=>q.cat.includes('เหตุผล'));case 'thai':return aptitude.filter(q=>q.cat==='ภาษาไทย');case 'spatial':return aptitude.filter(q=>q.cat==='มิติสัมพันธ์');case 'mistake':return Object.keys(state.wrong).map(id=>byId[id]).filter(Boolean);case 'apt':return aptitude;default:return []}}
function relevantTrack(){return state.track==='fin'?'fin':'biz'}
function sample(items,n){const recent=new Set(state.seen.slice(-50));let ranked=[...items].sort((a,b)=>(recent.has(a.id)?1:0)-(recent.has(b.id)?1:0)||Math.random()-.5);return ranked.slice(0,Math.min(n,ranked.length))}
function dailyQuestions(){return [...sample(getPool('fm'),3),...sample(getPool('fe'),3),...sample(getPool('reason'),2),...sample(getPool('acc'),2),...sample(getPool(relevantTrack()),2)]}
function home(){let lev=levelProg();return `<section class="hero"><div class="hero-copy"><span class="kicker">✨ เรียนทีละนิด เก่งขึ้นทุกวัน</span><h1>ออกผจญภัย<br>พิชิตข้อสอบกัน!</h1><p>เล่นเกมสั้น ๆ สะสมดาว ปลดล็อกความรู้ และเตรียมสอบ ธ.ก.ส. แบบไม่ต้องกดดันตัวเอง 💗</p><div class="actions"><button class="btn primary" data-act="daily">🎁 ภารกิจวันนี้</button><button class="btn secondary" data-act="beginner">🌱 เริ่มจากพื้นฐาน</button></div></div><div class="dec-cloud cloud-a">☁</div><div class="mascot">${mascot}</div></section>

function hintFor(q){let t=q.cat||'';if(q.bank==='fm')return t.includes('ร้อยละ')?'เปลี่ยนเปอร์เซ็นต์เป็นทศนิยมก่อน เช่น 20% คือ 0.2':t.includes('ดอกเบี้ย')?'ดอกเบี้ย = เงินต้น × อัตราดอกเบี้ย × ระยะเวลา (ปี)':t.includes('ค่าเฉลี่ย')?'รวมทุกจำนวนแล้วหารด้วยจำนวนข้อมูล':'ลองแยกโจทย์เป็นขั้นสั้น ๆ แล้วคำนวณทีละขั้น';if(q.bank==='fe')return t.includes('Present')||t.includes('Subject')?'ดูว่าประธานคือ I, You, He, She หรือ They แล้วเลือกกริยาให้เข้ากัน':t.includes('Past')?'หาคำที่บอกเวลาในอดีต เช่น yesterday หรือ last week':'มองหาคำสำคัญในประโยคก่อน ไม่จำเป็นต้องแปลทุกคำ';return 'ลองดูคำถามอีกครั้งว่าโจทย์ถาม “อะไร” แล้วตัดตัวเลือกที่ขัดกับข้อมูลออกทีละข้อ'}
function quiz(){if(!session)return `<div class="card"><h2>ยังไม่มีด่านที่กำลังเล่น</h2><button class="btn primary" data-nav="home">กลับบ้าน</button></div>`;const q=byId[session.qids[session.index]];const a=session.answers[q.id];const answerReady=Number.isInteger(a);const checked=!!session.checked[q.id];const mock=session.mode==='mock';const total=session.qids.length;const pct=Math.round((session.index+1)/total*100);return `<div class="quiz-top"><button class="btn white tiny" data-act="quit">← กลับแผนที่</button><div class="tag">${e(session.name)} • ข้อ ${session.index+1}/${total}</div><div>${mock?'🎯 Boss Battle':'🎮 Adventure Mode'}</div></div><div class="quiz-panel"><div class="q-card"><div class="q-head"><span class="tag ${mock?'sun':'mint'}">${e(q.cat)}</span><span class="tiny-note">${mock?'เฉลยหลังส่งเท่านั้น':'ตอบแล้วเรียนรู้ได้ทันที'}</span></div><div style="margin-top:13px" class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><h2 class="question-title">${e(q.prompt)}</h2>${q.visual?`<div class="visual-holder">${q.visual}</div><p class="tiny-note" style="margin-top:-10px">📱 หากภาพแสดงไม่ครบ สามารถปัดกรอบภาพไปด้านข้างได้</p>`:''}<div class="options">${q.options.map((c,i)=>`<button class="option ${a===i?'selected':''} ${checked&&i===q.answer?'correct':''} ${checked&&a===i&&a!==q.answer?'wrong':''}" data-act="choice" data-choice="${i}" ${checked?'disabled':''}><span class="letter">${TH[i]}</span><span>${e(c)}</span></button>`).join('')}</div>${session.hints&&session.hints[q.id]&&!checked?`<div class="feedback"><h3>💡 ใบ้ให้เล็กน้อย</h3><p>${e(hintFor(q))}</p></div>`:``}${checked?`<div class="feedback ${a!==q.answer?'wrong':''}"><h3>${a===q.answer?'✨ เยี่ยมมาก! เก่งขึ้นอีกนิดแล้ว':'💗 ไม่เป็นไร เราเรียนรู้จากข้อนี้ได้'}</h3><p><b>คำตอบที่ถูก:</b> ${TH[q.answer]}. ${e(q.options[q.answer])}</p><p style="margin-top:8px"><b>อธิบาย:</b> ${e(q.explanation||'สังเกตรายละเอียดของโจทย์และตัวเลือกอีกครั้ง')}</p></div>`:''}<div class="actions" style="margin-top:22px">${mock?`<button class="btn white" data-act="prev" ${session.index===0?'disabled':''}>← ก่อนหน้า</button><button class="btn primary" data-act="next">${session.index===total-1?'ส่งข้อสอบ 🏁':'ถัดไป →'}</button>`:checked?`<button class="btn primary full" data-act="next">${session.index===total-1?'ดูผลภารกิจ 🏆':'ต่อไป →'}</button>`:`<button class="btn secondary tiny" data-act="hint">💡 ขอตัวช่วย</button><button class="btn primary" style="flex:1" data-act="check" ${answerReady?'':'disabled'}>✅ ตรวจคำตอบ</button>`}</div>${mock?'<p class="tiny-note">เลือกตัวเลือกแล้วเปลี่ยนข้อได้โดยไม่ต้องกดยืนยัน</p>':''}</div><aside class="q-aside"><div class="card"><div class="eyebrow">${mock?'TIME REMAINING':'YOUR ADVENTURE'}</div>${mock?`<div class="big-timer" id="timer">${showTime(Math.max(0,session.endsAt-Date.now()))}</div>`:`<div style="font-size:46px">${checked?(a===q.answer?'🌟':'💪'):'🐰'}</div><p class="tiny-note">ลองทำด้วยตัวเองก่อน เปิดเฉลยแล้วจึงเก็บ XP</p>`}<p class="tiny-note">เลือกคำตอบแล้ว ${mock?'กดถัดไปหรือเลือกหมายเลขข้อ':'กดตรวจคำตอบเพื่อดูคำอธิบาย'}</p>${mock?`<div class="q-nav-grid">${session.qids.map((id,i)=>`<button class="qnav ${i===session.index?'on':''} ${session.answers[id]!==undefined?'done':''}" data-act="jump" data-index="${i}">${i+1}</button>`).join('')}</div><button class="btn mint full" data-act="submit" style="margin-top:12px">ส่งข้อสอบตอนนี้</button>`:`<div class="status-line">เลือกโหมดสั้นเพื่อฝึกได้ทุกวัน ไม่ต้องรีบ 🐣</div>`}</div></aside></div>`}
function showTime(ms){const s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function recordAnswer(q,ans,correct,bonus){state.records.push({id:q.id,cat:q.cat,correct,date:today,at:Date.now()});state.records=state.records.slice(-800);state.seen.push(q.id);state.seen=state.seen.slice(-250);if(correct)delete state.wrong[q.id];else state.wrong[q.id]=Date.now();state.xp+=bonus}
function markActivity(){if(state.lastDay!==today){let prior=new Date(today+'T12:00:00+07:00');prior.setDate(prior.getDate()-1);state.streak=(state.lastDay===dateStr(prior))?state.streak+1:1;state.lastDay=today}}
function practice(key,count=8){let pool=key==='daily'?dailyQuestions():getPool(key);if(!pool.length){toast('ยังไม่มีคำถามในหมวดนี้ ลองเล่นหมวดอื่นก่อน');return}let items=key==='daily'?pool:sample(pool,count);startSession('practice',key,key==='daily'?'🎁 เควสต์ดาวประกาย':(worlds.find(w=>w.key===key)?.title||'ทบทวนข้อที่ผิด'),items,null)}
function startMock(key){let info=mockInfo.find(x=>x.key===key),pool=getPool(key);startSession('mock',key,info.title,pool,info.min)}
function startSession(mode,key,name,items,minutes){if(session){if(!confirm('มีด่านที่เล่นค้างอยู่ ต้องการเริ่มด่านใหม่และทิ้งความคืบหน้าเดิมหรือไม่?'))return}session={mode,key,name,qids:items.map(q=>q.id),index:0,answers:{},checked:{},hints:{},startedAt:Date.now(),endsAt:minutes?Date.now()+minutes*60000:null,xpEarned:0};persist();go('quiz')}
function next(){if(!session)return;if(session.index<session.qids.length-1){session.index++;persist();render();window.scrollTo(0,0)}else if(session.mode==='mock'){if(confirm('ต้องการส่งข้อสอบเพื่อดูคะแนนและเฉลยหรือไม่?'))finishSession(false)}else{if(!session.checked[session.qids[session.index]]){toast('กดตรวจคำตอบก่อนนะ 🐰');return}finishSession(false)}}
function finishSession(timedOut){if(!session)return;const s=session;const scored=s.qids.map(id=>{let q=byId[id],ans=s.answers[id];return {id,ans,correct:ans===q.answer}});let correct=scored.filter(x=>x.correct).length;let gain=s.xpEarned||0;if(s.mode==='mock'){for(let x of scored){const q=byId[x.id];recordAnswer(q,x.ans,x.correct,x.correct?3:0);gain+=x.correct?3:0}}if(s.key==='daily'&&state.dailyDone!==today){state.dailyDone=today;state.xp+=50;gain+=50}markActivity();state.sessions.push({name:s.name,key:s.key,correct,total:s.qids.length,xp:gain,date:today});state.sessions=state.sessions.slice(-30);state.lastResult={name:s.name,key:s.key,qids:s.qids,answers:s.answers,correct,total:s.qids.length,xp:gain,timedOut:!!timedOut};session=null;persist();go('result');if(correct/Math.max(1,scored.length)>=.7)celebrate()}
function check(){if(!session||session.mode==='mock')return;let q=byId[session.qids[session.index]],ans=session.answers[q.id];if(!Number.isInteger(ans)||session.checked[q.id])return;session.checked[q.id]=true;const correct=ans===q.answer;const gain=correct?10:3;recordAnswer(q,ans,correct,gain);session.xpEarned+=gain;persist();render();if(correct&&Math.random()<.3)celebrate()}
function thumb(q,idx){if(!q.visual||!Number.isInteger(idx)||q.options.length!==5||!q.options.every((x,i)=>x===TH[i]))return '';let doc=new DOMParser().parseFromString(q.visual,'image/svg+xml'),svg=doc.documentElement;if(svg.localName!=='svg')return '';let vb=(svg.getAttribute('viewBox')||'').split(/\s+/).map(Number);if(vb.length!==4||vb[2]!==780)return '';let x=[144,270,396,522,648][idx],id='crop-'+q.id+'-'+idx;const ns='http://www.w3.org/2000/svg';const out=document.createElementNS(ns,'svg');out.setAttribute('viewBox','0 0 116 145');out.setAttribute('style','overflow:hidden');let defs=document.createElementNS(ns,'defs'),cp=document.createElementNS(ns,'clipPath');cp.id=id;cp.setAttribute('clipPathUnits','userSpaceOnUse');const clip=document.createElementNS(ns,'rect');clip.setAttribute('x','0');clip.setAttribute('y','0');clip.setAttribute('width','116');clip.setAttribute('height','145');cp.appendChild(clip);defs.appendChild(cp);out.appendChild(defs);let g=document.createElementNS(ns,'g');g.setAttribute('clip-path',`url(#${id})`);let sh=document.createElementNS(ns,'g');sh.setAttribute('transform',`translate(${-x} -8)`);for(const child of [...svg.childNodes])sh.appendChild(document.importNode(child,true));g.appendChild(sh);out.appendChild(g);return '<div class="cropped">'+new XMLSerializer().serializeToString(out)+'</div>'}
function reviewEntry(id,ans){const q=byId[id],good=ans===q.answer;return `<div class="review-card" data-review="${id}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>ข้อ ${e(id)} • ${e(q.cat)}</b><span class="tag ${good?'mint':'rose'}">${good?'✓ ถูกต้อง':'✗ ผิด/เว้น'}</span></div><p style="line-height:1.8">${e(q.prompt)}</p>${q.visual?`<div class="visual-holder">${q.visual}</div>`:''}<div class="compare-answer"><div class="compare-box"><strong>📝 คำตอบของคุณ</strong>${thumb(q,ans)||''}<p>${Number.isInteger(ans)?TH[ans]+'. '+e(q.options[ans]):'ไม่ได้ตอบ'}</p></div><div class="compare-box win"><strong>✅ คำตอบที่ถูกต้อง</strong>${thumb(q,q.answer)||''}<p>${TH[q.answer]}. ${e(q.options[q.answer])}</p></div></div><p style="line-height:1.8;font-size:13px;color:#6d7892">💡 ${e(q.explanation||'โปรดตรวจโจทย์และตัวเลือกอีกครั้ง')}</p><button class="btn white tiny" data-act="report" data-key="${id}">🚩 แจ้งข้อสงสัยเกี่ยวกับโจทย์นี้</button></div>`}
function results(){let r=state.lastResult;if(!r)return `<div class="card">ยังไม่มีผลสอบล่าสุด</div>`;let good=r.correct,total=r.total,pct=Math.round(good/total*100);let qs=r.qids.filter(id=>resultFilter==='all'||(resultFilter==='wrong'&&r.answers[id]!==byId[id].answer));return `<div class="result-header"><div style="font-size:58px">${pct>=80?'🏆':pct>=60?'🌟':'🐰'}</div><h1>${pct>=80?'เก่งมาก! ผ่านด่านอย่างสวยงาม':pct>=60?'เยี่ยมเลย! เก่งขึ้นอีกก้าว':'เก่งขึ้นได้เสมอ ลองใหม่กัน!'}</h1><div class="score">${good} / ${total}</div><p>${e(r.name)} • ถูก ${pct}% ${r.timedOut?'• เวลาหมด':''}</p><span class="tag sun">⭐ รับ +${r.xp} XP</span></div><div class="result-stats"><div class="card"><strong>${total-good}</strong><span>ข้อผิดหรือเว้น</span></div><div class="card"><strong>${Object.keys(state.wrong).length}</strong><span>รายการทบทวน</span></div><div class="card"><strong>${state.streak}</strong><span>วันที่เล่นต่อเนื่อง</span></div></div><div class="actions"><button class="btn primary" data-nav="home">🏡 กลับแผนที่</button><button class="btn mint" data-act="mistake" ${Object.keys(state.wrong).length?'':'disabled'}>🔁 ทบทวนข้อที่ผิด</button><button class="btn secondary" data-act="export">💾 บันทึกผล</button></div><div class="section-heading"><div><h2>📖 สมุดเฉลยของคุณ</h2><p>ดูทั้งโจทย์และภาพที่ตอบ เทียบกับเฉลย แล้วอ่านเหตุผล</p></div><div class="filters"><button data-act="filter" data-key="all" class="${resultFilter==='all'?'on':''}">ทุกข้อ (${total})</button><button data-act="filter" data-key="wrong" class="${resultFilter==='wrong'?'on':''}">เฉพาะข้อที่ผิด (${total-good})</button></div></div>${qs.length?qs.map(id=>reviewEntry(id,r.answers[id])).join(''):'<div class="card empty">ไม่มีข้อผิดในชุดนี้ เก่งมาก! 🎉</div>'}`}
function exportProgress(){let data={app:'BAAC Quest Academy',version:'1.0',date:today,summary:{xp:state.xp,streak:state.streak,completed:state.sessions.length},records:state.records,sessions:state.sessions,wrong:Object.keys(state.wrong),reports:state.reports,lastResult:state.lastResult||null};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='BAAC_Quest_Progress_'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('บันทึกผลการเรียนเป็นไฟล์ JSON แล้ว')}
function tickTimer(){if(!session||session.mode!=='mock'||page!=='quiz')return;let ms=Math.max(0,session.endsAt-Date.now()),el=document.getElementById('timer');if(el){el.textContent=showTime(ms);el.classList.toggle('urgent',ms<=180000)}if(ms<=0)finishSession(true)}
setInterval(tickTimer,800);
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-nav],[data-act]');if(!el)return;const act=el.dataset.act,key=el.dataset.key;if(el.dataset.nav){if(session){if(!confirm('กำลังเล่นอยู่ กลับไปหน้าหลักโดยพักข้อสอบไว้ก่อนได้ ต้องการออกจากหน้านี้หรือไม่?'))return}go(el.dataset.nav);return}switch(act){case 'daily':practice('daily');break;case 'beginner':go('learn');break;case 'practice':case 'zone':practice(key);break;case 'track':state.track=key;persist();render();toast('เลือกเส้นทางอาชีพแล้ว');break;case 'mistake':practice('mistake');break;case 'mock':startMock(key);break;case 'choice':{if(!session)return;let q=byId[session.qids[session.index]];if(session.checked[q.id])return;session.answers[q.id]=Number(el.dataset.choice);persist();render();break}case 'hint':if(session){let q=byId[session.qids[session.index]];session.hints=session.hints||{};session.hints[q.id]=true;persist();render()}break;case 'check':check();break;case 'next':next();break;case 'prev':if(session&&session.index>0){session.index--;persist();render()}break;case 'jump':if(session&&session.mode==='mock'){session.index=Number(el.dataset.index);persist();render();window.scrollTo(0,0)}break;case 'submit':if(confirm('ต้องการส่งข้อสอบหรือไม่? จะดูเฉลยหลังส่งเท่านั้น'))finishSession(false);break;case 'quit':go('home');toast('บันทึกด่านที่เล่นค้างไว้แล้ว กดเล่นต่อได้เมื่อกลับมา');break;case 'resume':go('quiz');break;case 'discard':if(confirm('ลบด่านที่เล่นค้างอยู่โดยไม่เก็บคะแนนหรือไม่?')){session=null;persist();render()}break;case 'filter':resultFilter=key;render();break;case 'export':exportProgress();break;case 'report':{let desc=prompt('บอกจุดที่สงสัยในข้อ '+key+' (เก็บไว้ในเครื่องและส่งออกเป็นไฟล์ได้)');if(desc){state.reports.push({id:key,detail:desc,date:today});persist();toast('บันทึกข้อสงสัยแล้ว')}}break;case 'clear':if(confirm('จะลบคะแนน XP และข้อมูลการเรียนทั้งหมดในเครื่องนี้จริงหรือไม่?')){state=defaultState();session=null;persist();go('home')}break}});
if(session&&!session.endsAt)session.endsAt=null;
render();
if(session){let banner=document.createElement('div');banner.style.cssText='position:fixed;z-index:50;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #e8e4ff;border-radius:18px;padding:8px 12px;box-shadow:0 10px 35px #7776;display:flex;gap:9px;align-items:center;font-size:13px';banner.innerHTML=`<span>📚 มีด่านค้างอยู่ ${e(session.name)}</span><button class="btn primary tiny" data-act="resume">เล่นต่อ</button>`;document.body.appendChild(banner);setTimeout(()=>banner.remove(),8000)}
</script>
</body>
